name: Accounting safety net

on: [push, pull_request]

permissions:
  contents: read

jobs:
  posting-and-report-safety:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository dependencies and pytest
        run: python -m pip install -r requirements-dev.txt

      - name: Run headless posting and report safety tests
        run: python -m pytest -q tests/test_accounting_safety_net.py

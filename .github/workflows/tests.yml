name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    # Pinned (2.9.73): "ubuntu-latest" moves to Ubuntu 26 from 19-10-2026; the Tk tests are checked on 24.04.
    runs-on: ubuntu-24.04

    steps:
      - name: Download source
        uses: actions/checkout@v5

      # NOTE: we deliberately use the system Python (with the matching system
      # Tk) instead of actions/setup-python. The app uses tkinter, and a
      # setup-python interpreter can ship a Tk build that does not match the
      # runner's, which breaks the GUI import during tests.
      - name: Install system dependencies (Tk + headless X server)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk python3-venv xvfb

      - name: Create virtual environment and install requirements
        run: |
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          # Same pinned versions as the Windows build (requirements.txt); PyInstaller is only needed there.
          grep -iv '^pyinstaller' requirements.txt > ci-requirements.txt
          python -m pip install -r ci-requirements.txt

      - name: Audit runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Prepare case-sensitive asset path
        # Tests/code reference the assets under a lowercase "assets" folder,
        # but the repository ships them as "Assets". On case-sensitive Linux
        # filesystems we add a lowercase symlink so both spellings resolve.
        run: ln -sf Assets assets

      - name: Check purchase layout event-loop progress
        timeout-minutes: 4
        run: |
          . .venv/bin/activate
          xvfb-run -a -s "-screen 0 1920x1080x24" python -c 'import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); unittest.main(module=None, argv=["unittest", "tests.test_purchase_header_layout.PurchaseHeaderLayoutTest.test_five_line_purchase_has_four_complete_rows_at_laptop_scaling", "-v"])'

      - name: Run all tests
        run: |
          . .venv/bin/activate
          xvfb-run -a -s "-screen 0 1920x1080x24" python -m unittest discover -v -s tests -t . -p "test_*.py"

  # 2.9.88: the same tests on Windows (the computer the program runs on): start-up with a busy -shm file,
  # several users, speed and every screen.
  windows:
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/checkout@v5

      - name: Set up Python (with Tk)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^pyinstaller' } | Set-Content ci-requirements.txt
          python -m pip install -r ci-requirements.txt

      - name: Run all tests
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          # The default hosted desktop is 1024px wide and clamps a requested 1366px test window.
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Test display: $($bounds.Width)x$($bounds.Height)"
          if ($bounds.Width -lt 1920 -or $bounds.Height -lt 1080) { throw "The laptop layout matrix requires a 1920x1080 test desktop." }
          python -m unittest discover -v -s tests -t . -p "test_*.py"
